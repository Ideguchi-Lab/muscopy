name: Build and Upload Release

on:
  push:
    tags:
      - 'v*.*.*'  # tag starting with 'v' and followed by version number

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build the package
      run: |
        python -m build

    - name: Check built package metadata
      run: |
        python -m twine check dist/*
        python - <<'PY'
        import email.message
        import email.parser
        import os
        import tarfile
        import tomllib
        import zipfile
        from pathlib import Path

        project_config = tomllib.loads(Path("pyproject.toml").read_text())
        project = project_config["project"]
        expected_metadata = {
            "Name": project["name"],
            "Version": project["version"],
            "Requires-Python": project["requires-python"],
        }
        expected_extras = set(project_config["tool"]["setuptools"]["dynamic"]["optional-dependencies"])
        tag_name = os.environ.get("GITHUB_REF_NAME")
        if tag_name is not None:
            expected_tag = f"v{project['version']}"
            if tag_name != expected_tag:
                raise RuntimeError(f"Release tag is {tag_name!r}, expected {expected_tag!r}")

        def parse_metadata(text: str) -> email.message.Message:
            return email.parser.Parser().parsestr(text)

        def wheel_metadata(path: Path) -> email.message.Message:
            with zipfile.ZipFile(path) as wheel:
                metadata_name = next(name for name in wheel.namelist() if name.endswith(".dist-info/METADATA"))
                return parse_metadata(wheel.read(metadata_name).decode())

        def sdist_metadata(path: Path) -> email.message.Message:
            with tarfile.open(path) as sdist:
                pkg_info_name = next(name for name in sdist.getnames() if name.endswith("/PKG-INFO"))
                pkg_info = sdist.extractfile(pkg_info_name)
                if pkg_info is None:
                    raise RuntimeError(f"Could not read {pkg_info_name} from {path}")
                return parse_metadata(pkg_info.read().decode())

        metadata_files = {
            path: wheel_metadata(path) if path.suffix == ".whl" else sdist_metadata(path)
            for path in Path("dist").iterdir()
            if path.suffix == ".whl" or path.name.endswith(".tar.gz")
        }
        if not metadata_files:
            raise RuntimeError("No wheel or source distribution found in dist/")

        for path, metadata in metadata_files.items():
            for field, expected in expected_metadata.items():
                actual = metadata[field]
                if actual != expected:
                    raise RuntimeError(f"{path}: {field} is {actual!r}, expected {expected!r}")

            actual_extras = set(metadata.get_all("Provides-Extra", []))
            if actual_extras != expected_extras:
                raise RuntimeError(f"{path}: Provides-Extra is {sorted(actual_extras)}, expected {sorted(expected_extras)}")
        PY

    - name: Extract release notes from CHANGELOG.md
      id: extract_changelog
      run: |
        RELEASE_NOTES=$(sed -n '/## Version/,/---/{p; /---/q}' CHANGELOG.md | sed '$d')
        echo "${RELEASE_NOTES}" >> ./.github/workflows/release_template.md

    - name: Display Release Notes
      run: cat ./.github/workflows/release_template.md

    - name: Create Release and Upload Assets
      uses: ncipollo/release-action@v1
      with:
        artifacts: "dist/*"  # upload all files in the dist folder
        tag: ${{ github.ref }}
        name: ${{ github.ref }}
        bodyFile: ./.github/workflows/release_template.md
        draft: false
        prerelease: false
