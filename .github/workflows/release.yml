name: Build and Upload Release

on:
  push:
    tags:
      - 'v*.*.*'  # tag starting with 'v' and followed by version number

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build the package
      run: |
        python -m build

    - name: Extract release notes from CHANGLOG.md
      id: extract_changelog
      run: |
        RELEASE_NOTES=$(sed -n '/## Version/,/---/{p; /---/q}' CHANGELOG.md | sed '$d')
        echo "${RELEASE_NOTES}" > release_notes.md

    - name: Display Release Notes
      run: cat release_notes.md

    - name: Create Release and Upload Assets
      uses: ncipollo/release-action@v1
      with:
        artifacts: "dist/*"  # upload all files in the dist folder
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        name: ${{ github.ref }}
        body_path: release_notes.md
        draft: false
        prerelease: false