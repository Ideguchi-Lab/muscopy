name: Build and Upload Release

on:
  push:
    tags:
      - 'v*.*.*'  # tag starting with 'v' and followed by version number

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - uses: astral-sh/setup-uv@v10.0.1
      with:
        uv-version: "0.11.16"
        enable-cache: true

    - name: Build the package
      run: uv run --no-project --with build==1.5.0 python -m build --installer uv

    - name: Check built package metadata
      run: |
        uv run --no-project --with twine==6.2.0 twine check --strict dist/*
        uv run --no-project python scripts/check_package_metadata.py

    - name: Save distributions for PyPI
      uses: actions/upload-artifact@v7
      with:
        name: distributions
        path: dist/*
        if-no-files-found: error

    - name: Extract release notes from CHANGELOG.md
      id: extract_changelog
      run: |
        RELEASE_NOTES=$(sed -n '/## Version/,/---/{p; /---/q}' CHANGELOG.md | sed '$d')
        echo "${RELEASE_NOTES}" >> ./.github/workflows/release_template.md

    - name: Display Release Notes
      run: cat ./.github/workflows/release_template.md

    - name: Create Release and Upload Assets
      uses: ncipollo/release-action@v1
      with:
        artifacts: "dist/*"  # upload all files in the dist folder
        tag: ${{ github.ref }}
        name: ${{ github.ref }}
        bodyFile: ./.github/workflows/release_template.md
        draft: false
        prerelease: false

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/muscopy/
    permissions:
      id-token: write
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
