[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "muscopy"
version = "1.0.0"
description = "A library for microscopy analyze functions"
readme = "README.md"
authors = [{name="Masato Fukushima", email="masato63fuk@g.ecc.u-tokyo.ac.jp"}]
license = {file = "LICENSE"}
requires-python = ">=3.11, <3.15"
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "scikit-image",
    "tqdm>4.60.0",
    "types-tqdm",
    "typing-extensions",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pyright==1.1.409",
    "pytest==9.0.3",
    "ruff==0.15.14",
]
doc = [
    "matplotlib>=3.5.0",
    "numpy>=1.22.0",
    "scipy>=1.10.0",
    "sphinx>=7.4.0",
    "sphinx-gallery>=0.17.0",
    "sphinx-rtd-theme",
]
extra = [
    "muscopy-mlbsim @ git+https://github.com/Ideguchi-Lab/muscopy-mlbsim.git",
]
cupy = [
    "cupy-cuda12x>=14.1.0",
]

[tool.setuptools.package-data]
muscopy = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  # Conflicts with ruff format
  "COM812",
  "COM819",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "ISC001",
  "ISC002",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "W191",

  # Not necessary for this project
  "AIR",
  "ASYNC",
  "DJ",
  "PD",

  # Manually disabled
  "CPY",     # copyright missing
  "D105",    # undocumented magic method
  "ERA",     # commented-out code
  "FBT",     # boolean-trap
  "FIX",     # fixme
  "PLR0904", # too-many-public-methods
  "PLR0913", # too-many-arguments
  "PLR0917", # too-many-positional-arguments
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
  "S101",    # `assert` detected
  "D100",
  "D103",
  "D104",
  "D400",
  "DOC",
  "PLR2004", # magic value
]
"examples/*.py" = [
  "T201", # print
  "D205", # conflicts with sphinx-gallery
  "D400", # conflicts with sphinx-gallery
]

[tool.pytest.ini_options]
pythonpath = ["muscopy"]
testpaths = ["tests"]
filterwarnings = "ignore::DeprecationWarning"
markers = "slow: mark test as slow"

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["muscopy", "tests", "examples"]
exclude = [
    "muscopy/cuda/.*",
    "tests/test_cuda_qpi.py",
]

[tool.pyright]
include = ["muscopy", "tests", "examples"]
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
ignore = [
    "muscopy/cuda",
    "examples/idt_with_mlb_simulation.py",
    "examples/odt_with_mlb_simulation.py",
    "tests/test_cuda_qpi.py"
]
