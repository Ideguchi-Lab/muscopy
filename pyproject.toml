[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "muscopy"
version = "0.6.2"
description = "A library for microscopy analyze functions"
readme = "README.md"
authors = [{name="Masato Fukushima", email="masato63fuk@g.ecc.u-tokyo.ac.jp"}]
license = {file = "LICENSE"}
requires-python = ">=3.11.0"
dynamic = ["dependencies", "optional-dependencies"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = ["requirements-dev.txt"] }
doc = { file = ["docs/requirements.txt"] }
extra = { file = ["requirements-extra.txt"] }

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  # Conflicts with ruff format
  "COM812",
  "COM819",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "ISC001",
  "ISC002",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "W191",

  # Not necessary for this project
  "AIR",
  "ASYNC",
  "DJ",
  "PD",

  # Manually disabled
  "CPY",     # copyright missing
  "D105",    # undocumented magic method
  "ERA",     # commented-out code
  "FBT",     # boolean-trap
  "FIX",     # fixme
  "PLR0904", # too-many-public-methods
  "PLR0913", # too-many-arguments
  "PLR0917", # too-many-positional-arguments
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
  "S101",    # `assert` detected
  "D100",
  "D103",
  "D104",
  "D400",
  "DOC",
  "PLR2004", # magic value
]
"examples/*.py" = [
  "T201", # print
  "D205", # conflicts with sphinx-gallery
  "D400", # conflicts with sphinx-gallery
]

[tool.pytest.ini_options]
pythonpath = ["muscopy"]
testpaths = ["tests"]
filterwarnings = "ignore::DeprecationWarning"
markers = "slow: mark test as slow"

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["muscopy", "tests", "examples"]

[tool.pyright]
include = ["muscopy", "tests", "examples"]
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
ignore = [
    "examples/idt_with_mlb_simulation.py",
    "examples/odt_with_mlb_simulation.py"
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.3",
    "mypy>=1.17.0",
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "ruff>=0.12.4",
    "scikit-image>=0.25.2",
]
